<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CCTV Description Demo</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css?v=501009c2c116"></head><body>
<header><h1>CCTV Description Demo</h1><div><span id="modelStatus"></span><button id="settingsButton">Settings</button></div></header>
<div class="toolbar"><label id="dropzone" tabindex="0" role="button" aria-label="Add videos"><input type="file" id="files" accept="video/mp4,video/quicktime,video/webm,video/x-m4v" multiple hidden>＋ Add videos</label><button id="addFolder" type="button">＋ Add folder</button><input type="file" id="folder" webkitdirectory multiple hidden><span class="limits">Max 5 minutes · 500 MB per video</span><span id="uploadStatus" role="status"></span><button id="start" class="primary" disabled>Generate descriptions</button></div>
<details id="uploadErrors" hidden><summary id="uploadErrorSummary"></summary><ul id="uploadErrorList"></ul></details><main><aside><div class="heading"><h2>Videos <span id="count">0</span></h2></div><div id="queue"></div><div id="queueNote">One video at a time.</div></aside><section><div class="heading"><h2>Preview</h2><span id="status"></span></div><div id="detail"></div></section></main>
<dialog id="settings"><form id="settingsForm"><div class="modal-heading"><h2>Model settings</h2><button type="button" id="close" aria-label="Close settings">×</button></div><label>Run model on<select id="mode"><option value="local">This Mac (Ollama)</option><option value="notebook">Notebook GPU</option></select></label><label>Server URL<input id="endpoint" type="url" required></label><fieldset id="modelLabel"><legend>Model</legend><input type="hidden" id="model"><div id="modelChoices">Loading models…</div><button type="button" id="refreshModels">Refresh models</button></fieldset><label id="personLabelsLabel"><input type="checkbox" id="personLabels"> Person labels (YOLO)</label><p id="settingsNote"></p><div id="settingsError" role="alert"></div><button class="primary" type="submit">Save</button></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script src="/app.js?v=d553aa4a8540"></script></body></html>
